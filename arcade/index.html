<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>像素街机厅 · Eleven Arcade</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="../assets/favicon.svg">
<style>
:root{--gold:#ffc93c;--pink:#ff4fd8;--cyan:#5ef2ff;--red:#ff4a4a;--mono:"Courier New",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
body{color:#fff;font-family:var(--mono);-webkit-font-smoothing:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hall{image-rendering:pixelated;opacity:0;pointer-events:none}
.hallmode #hall{pointer-events:auto}
.crt{position:fixed;inset:0;pointer-events:none;z-index:30;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.65))}
.black{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:25}
.white{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:26}

/* ---- coin scene UI ---- */
.cui{position:fixed;inset:0;pointer-events:none;z-index:10;transition:opacity .4s}
.cui .title{position:absolute;top:max(26px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-weight:900;letter-spacing:.5em;font-size:clamp(16px,2.2vw,26px)}
.cui .title small{display:block;margin-top:10px;font-size:12px;letter-spacing:.45em;color:#b9a06a;font-weight:700}
.cui .call{position:absolute;left:0;right:0;bottom:max(7vh,calc(env(safe-area-inset-bottom) + 24px));text-align:center}
.cui .call b{display:block;font-size:clamp(18px,2.2vw,24px);letter-spacing:.4em;color:var(--gold);text-shadow:0 0 12px #ff8a00;animation:blink 1.1s steps(1) infinite}
.cui .call span{display:block;margin-top:12px;font-size:13px;letter-spacing:.3em;color:#9d9d9d;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.corner{position:fixed;top:max(22px,env(safe-area-inset-top));z-index:40;font-size:13px;font-weight:700;letter-spacing:.15em;color:#bbb;pointer-events:auto;padding:6px 4px}
.corner:hover{color:#fff}
.corner.l{left:clamp(14px,3vw,34px)}.corner.r{right:clamp(14px,3vw,34px)}

/* ---- hall UI ---- */
.hud{position:fixed;left:0;right:0;top:0;z-index:35;display:flex;justify-content:center;align-items:center;padding:max(14px,env(safe-area-inset-top)) 110px 0;
  opacity:0;transition:opacity .6s;pointer-events:none}
.hallmode .hud{pointer-events:auto}
.hud .cr{position:absolute;right:clamp(14px,3vw,34px);top:max(22px,env(safe-area-inset-top));font-weight:900;font-size:13px;letter-spacing:.12em;text-shadow:2px 2px 0 #000}
.hud b{color:var(--red)}
.zones{display:flex;gap:6px;padding:5px;background:#0b0716;border:2px solid #fff;box-shadow:0 0 0 2px #000,4px 4px 0 2px #000;max-width:100%;overflow-x:auto;scrollbar-width:none}
.zones::-webkit-scrollbar{display:none}
.zones button{font:900 13px/1 "PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.12em;padding:9px 14px;border:0;background:transparent;color:#8f88aa;cursor:pointer;white-space:nowrap}
.zones button small{font:700 9px var(--mono);letter-spacing:.1em;margin-left:6px;color:#5d5775}
.zones button.on{background:var(--pink);color:#fff;box-shadow:inset -3px -3px 0 #a3138a,inset 3px 3px 0 #ff9cec}
.zones button:not(.on):hover{color:#fff}
.toast{position:fixed;left:50%;top:84px;z-index:40;transform:translate(-50%,-10px);opacity:0;transition:.3s;background:#000;border:2px solid var(--gold);color:var(--gold);
  padding:10px 16px;font:900 13px "PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.1em;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.panel{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:20;width:min(760px,calc(100% - 24px));transform:translate(-50%,30px);opacity:0;
  transition:opacity .5s,transform .5s;background:#0b0716;border:3px solid #fff;box-shadow:0 0 0 3px #000,6px 6px 0 3px #000,0 0 30px rgba(255,79,216,.35);
  padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;image-rendering:pixelated}
.panel.on{opacity:1;transform:translate(-50%,0)}
.panel img{width:64px;height:64px;image-rendering:pixelated;border:3px solid var(--gold);background:#222}
.panel .nm{font-size:22px;font-weight:900;letter-spacing:.08em;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.panel .nm small{font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--gold);margin-left:10px}
.panel .ds{margin-top:6px;font-size:13px;line-height:1.6;color:#c9c2dd;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.panel .st{margin-top:6px;font-size:12px;letter-spacing:.15em;color:#7dff8a}
.panel .st.off{color:#888}
.start{font-family:var(--mono);font-weight:900;font-size:16px;letter-spacing:.15em;padding:14px 18px;border:0;cursor:pointer;color:#000;background:var(--gold);
  box-shadow:inset -4px -4px 0 #b07800,inset 4px 4px 0 #fff3b8,0 0 0 3px #000;white-space:nowrap}
.start:active{transform:translateY(2px)}
.start[disabled]{background:#555;box-shadow:inset -4px -4px 0 #333,inset 4px 4px 0 #777,0 0 0 3px #000;color:#222;cursor:default}
.keys{position:fixed;right:clamp(14px,3vw,34px);bottom:calc(max(18px,env(safe-area-inset-bottom)) + 150px);z-index:20;font-size:11px;letter-spacing:.15em;color:#8a83a3;text-align:right;line-height:1.8;opacity:0;transition:opacity .6s}
.hallmode .hud,.hallmode .keys{opacity:1}
.hallmode .cui{opacity:0}
@keyframes blink{50%{opacity:0}}
@media (max-height:700px) and (max-width:640px){.panel .ds{display:none}}
@media (max-width:640px){
  .cui .title{top:calc(max(22px,env(safe-area-inset-top)) + 40px);letter-spacing:.3em;font-size:16px}
  .panel{grid-template-columns:auto 1fr;padding:12px}
  .panel img{width:52px;height:52px}
  .panel .start{grid-column:1/-1}
  .panel .ds{font-size:12px}
  .keys{display:none}
  .hud{padding:max(56px,calc(env(safe-area-inset-top) + 44px)) 10px 0}
  .zones button{padding:8px 10px;font-size:12px}
  .toast{top:120px}
}
</style>
</head>
<body>
<canvas id="coin" aria-label="投币"></canvas>
<canvas id="hall" aria-label="像素街机厅"></canvas>

<div class="cui" id="cui">
  <div class="title">ELEVEN ARCADE<small>游戏世界 · GAME WORLD</small></div>
  <div class="call"><b>DROP A COIN ▼</b><span>把币拖进投币口（或者点一下币）</span></div>
</div>
<a class="corner l" href="../">← 首页</a>
<a class="corner r" id="skip" href="#hall">跳过 ›</a>

<div class="hud"><nav class="zones" id="zones"></nav><span class="cr"><b>CREDIT</b> <span id="credit">00</span></span></div>
<div class="toast" id="toast"></div>
<div class="panel" id="panel">
  <img id="pImg" alt="">
  <div><div class="nm" id="pName"></div><div class="ds" id="pDesc"></div><div class="st" id="pSt"></div></div>
  <button class="start" id="pGo">▶ START</button>
</div>
<div class="keys">← → 选机器<br>ENTER 开始<br>ESC 退币</div>
<div class="black" id="black"></div><div class="white" id="white"></div>
<div class="crt"></div>

<script src="../data.js"></script>
<script>
'use strict';
const A = window.ARCADE;
const ZONE = 'pixel';
const root = p => /^https?:/.test(p) ? p : '../' + p;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- 音效（投币叮 / 开机哔），用户手势后才会响 ---------------- */
let AC = null;
function beep(seq) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    let t = AC.currentTime;
    for (const [f, d, type = 'square', v = .06] of seq) {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d); t += d * .8;
    }
  } catch (e) {}
}
const sndCoin = () => beep([[988, .09], [1319, .35]]);
const sndBoot = () => beep([[220, .08], [330, .08], [440, .08], [660, .2]]);
const sndMove = () => beep([[660, .05, 'square', .035]]);
const sndStart = () => beep([[523, .07], [659, .07], [784, .07], [1047, .3]]);

/* =====================================================================
   场景一：巨型游戏币 + 投币口
   ===================================================================== */
const coinCv = $('coin'), cg = coinCv.getContext('2d');
let CW, CH, cdpr;
const C = {
  x: 0, y: 0, s: 1, spin: 0, drag: null, back: null, insert: null, res: 1, zoom: 1,
  sparks: Array.from({ length: 34 }, () => ({ x: Math.random() - .5, y: Math.random() - .5, p: Math.random() * 6, s: 2 + Math.random() * 5 })),
  credit: 0, led: 0, done: false,
};
function coinLayout() {
  const R = Math.min(CH * .25, CW * .36);
  const pw = Math.min(260, CW * .7), ph = 72, py = CH * .7;
  return { cx: CW / 2, cy: CH * .4, R, panel: { x: CW / 2 - pw / 2, y: py, w: pw, h: ph }, slot: { x: CW / 2 - 7, y: py + 12, w: 14, h: ph - 24 } };
}
function coinSize() {
  cdpr = Math.min(devicePixelRatio || 1, 2); CW = innerWidth; CH = innerHeight;
  const L = coinLayout(); if (!C.drag && !C.insert && !C.back) { C.x = L.cx; C.y = L.cy; }
}

function drawCoin(g, x, y, R, ang, t) {
  // ang：绕竖轴的转角。正面宽 R|cos|，侧边厚度 T|sin|
  const T = R * .1, c = Math.cos(ang), sn = Math.sin(ang), fw = Math.max(.02, Math.abs(c));
  const edgeDx = T * sn;
  for (let k = 10; k >= 0; k--) {             // 侧边（齿边）
    const dx = edgeDx * k / 10;
    g.fillStyle = k % 2 ? '#9a6200' : '#b97c00';
    g.beginPath(); g.ellipse(x + dx, y, R * fw, R, 0, 0, Math.PI * 2); g.fill();
  }
  g.save(); g.translate(x, y); g.scale(fw, 1);
  const gr = g.createLinearGradient(-R, -R, R, R);
  gr.addColorStop(0, '#fff3b6'); gr.addColorStop(.32, '#ffcb40'); gr.addColorStop(.68, '#d48c00'); gr.addColorStop(1, '#ffe27a');
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(122,70,0,.55)'; g.lineWidth = R * .035; g.beginPath(); g.arc(0, 0, R * .86, 0, Math.PI * 2); g.stroke();
  g.fillStyle = 'rgba(122,70,0,.5)';
  for (let i = 0; i < 64; i++) { const a = i / 64 * Math.PI * 2; g.beginPath(); g.arc(Math.cos(a) * R * .93, Math.sin(a) * R * .93, R * .013, 0, Math.PI * 2); g.fill(); }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `900 ${R * .95 | 0}px "Arial Black","Helvetica Neue",Impact,sans-serif`;
  g.fillStyle = 'rgba(110,60,0,.85)'; g.fillText('11', R * .03, R * .07);
  g.fillStyle = '#ffe58a'; g.fillText('11', -R * .02, R * .01);
  g.font = `700 ${R * .075 | 0}px ${'"Courier New",monospace'}`; g.fillStyle = 'rgba(110,60,0,.85)';
  const s = '★ ELEVEN ARCADE ★ 十一号街机厅 ', n = s.length;
  for (let i = 0; i < n; i++) { g.save(); g.rotate(-Math.PI / 2 + (i - n / 2) / n * Math.PI * 1.9 + Math.PI / 2); g.translate(0, -R * .74); g.fillText(s[i], 0, 0); g.restore(); }
  // 扫光
  const sh = (t * .35) % 2 - .5;
  const lg = g.createLinearGradient(-R + sh * R * 2, -R, R * .2 + sh * R * 2, R);
  lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(.45, 'rgba(255,255,255,.5)'); lg.addColorStop(.55, 'rgba(255,255,255,0)');
  g.fillStyle = lg; g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.fill();
  g.restore();
}

function drawCoinScene(t) {
  const L = coinLayout();
  // 画布分辨率随像素化程度变化（转场时越来越粗）
  const res = C.res, w = Math.max(8, Math.round(CW * cdpr * res)), h = Math.max(8, Math.round(CH * cdpr * res));
  if (coinCv.width !== w || coinCv.height !== h) { coinCv.width = w; coinCv.height = h; }
  coinCv.style.imageRendering = res < .9 ? 'pixelated' : 'auto';
  const g = cg; g.setTransform(1, 0, 0, 1, 0, 0); g.imageSmoothingEnabled = res > .9;
  g.scale(cdpr * res, cdpr * res);
  // 镜头推近投币口
  const fx = L.slot.x + L.slot.w / 2, fy = L.slot.y + L.slot.h * .3;
  g.translate(fx, fy); g.scale(C.zoom, C.zoom); g.translate(-fx, -fy);

  const bg = g.createRadialGradient(L.cx, L.cy, 10, L.cx, L.cy, Math.max(CW, CH) * .75);
  bg.addColorStop(0, '#3a2406'); bg.addColorStop(.5, '#140b02'); bg.addColorStop(1, '#000');
  g.fillStyle = bg; g.fillRect(-CW, -CH, CW * 3, CH * 3);
  // 放射光
  g.save(); g.translate(L.cx, L.cy); g.rotate(t * .06);
  const M = Math.max(CW, CH) * 1.5;
  for (let i = 0; i < 24; i++) { g.rotate(Math.PI / 12); g.fillStyle = i % 2 ? 'rgba(255,190,60,.07)' : 'rgba(255,190,60,.025)'; g.beginPath(); g.moveTo(0, 0); g.lineTo(M, -M * .09); g.lineTo(M, M * .09); g.fill(); }
  g.restore();
  // 闪光
  for (const s of C.sparks) {
    const a = (Math.sin(t * 2.2 + s.p) + 1) / 2; if (a < .15) continue;
    const x = L.cx + s.x * CW * .85, y = L.cy + s.y * CH * .8, z = s.s * a;
    g.fillStyle = `rgba(255,246,200,${a})`;
    g.beginPath(); g.moveTo(x, y - z * 2); g.lineTo(x + z * .35, y); g.lineTo(x, y + z * 2); g.lineTo(x - z * .35, y); g.fill();
    g.beginPath(); g.moveTo(x - z * 2, y); g.lineTo(x, y + z * .35); g.lineTo(x + z * 2, y); g.lineTo(x, y - z * .35); g.fill();
  }
  // 硬币
  let ang = Math.sin(t * 1.1) * .45;                  // 平时轻轻摇摆
  const cyc = t % 6; if (cyc > 5.1 && !C.drag && !C.insert) ang += easeOut((cyc - 5.1) / .9) * Math.PI * 2; // 每 6 秒转一圈
  if (C.insert) ang = lerp(C.insert.a0, Math.PI / 2, clamp(C.insert.k / .45, 0, 1));
  if (C.drag || C.back) ang *= .3;
  const bobY = (C.drag || C.insert || C.back) ? 0 : Math.sin(t * 1.6) * 8;
  // 地面阴影
  if (!C.insert) { g.fillStyle = 'rgba(0,0,0,.45)'; g.beginPath(); g.ellipse(C.x, L.cy + L.R * 1.12, L.R * .7 * C.s, L.R * .1 * C.s, 0, 0, Math.PI * 2); g.fill(); }
  drawCoin(g, C.x, C.y + bobY, L.R * C.s, ang, t);
  // 投币面板（画在硬币之后 = 硬币会“掉进去”）
  const P = L.panel;
  const ped = g.createLinearGradient(0, P.y, 0, P.y + P.h + 120); ped.addColorStop(0, '#16161c'); ped.addColorStop(.55, '#101015'); ped.addColorStop(1, 'rgba(10,10,14,0)');
  g.fillStyle = ped; g.fillRect(P.x, P.y, P.w, P.h + 120);
  g.fillStyle = '#24242d'; g.fillRect(P.x, P.y, P.w, 6);
  g.strokeStyle = '#ffcf4a'; g.lineWidth = 2; g.strokeRect(P.x + 1, P.y + 1, P.w - 2, P.h - 2);
  g.fillStyle = '#000'; g.fillRect(L.slot.x, L.slot.y, L.slot.w, L.slot.h);
  g.fillStyle = 'rgba(255,207,74,.35)'; g.fillRect(L.slot.x - 3, L.slot.y - 3, L.slot.w + 6, 2);
  const glow = C.led > 0 ? (Math.floor(C.led * 10) % 2 ? 1 : .35) : .85;
  g.font = '700 14px "Courier New",monospace'; g.textBaseline = 'middle';
  g.shadowColor = '#ff3c3c'; g.shadowBlur = 14; g.fillStyle = `rgba(255,70,70,${glow})`;
  g.textAlign = 'left'; g.fillText(C.credit ? 'CREDIT 01' : '1 COIN', P.x + 14, P.y + P.h / 2);
  g.textAlign = 'right'; g.fillText('1 PLAY', P.x + P.w - 14, P.y + P.h / 2);
  g.shadowBlur = 0;
}

function coinUpdate(dt, t) {
  const L = coinLayout();
  if (C.back) {               // 没投进去：弹回原位
    C.back.k += dt / .45; const k = easeOut(clamp(C.back.k, 0, 1));
    C.x = lerp(C.back.x, L.cx, k); C.y = lerp(C.back.y, L.cy, k); C.s = lerp(C.back.s, 1, k);
    if (C.back.k >= 1) C.back = null;
  }
  if (C.insert) {
    const I = C.insert; I.k += dt;
    const top = L.slot.y - L.R * .34;
    if (I.k < .45) { const k = ease(I.k / .45); C.x = lerp(I.x, L.cx, k); C.y = lerp(I.y, top, k); C.s = lerp(I.s, .34, k); }
    else if (I.k < .8) { const k = ease((I.k - .45) / .35); C.x = L.cx; C.y = lerp(top, L.slot.y + L.R * .5, k); C.s = .34; }
    if (I.k >= .8 && !I.dinged) { I.dinged = true; sndCoin(); C.credit = 1; C.led = 1; $('credit').textContent = '01'; }
    if (I.k > 1.05) {          // 镜头推进投币口 + 像素化
      const k = clamp((I.k - 1.05) / 1.1, 0, 1), e = k * k * k;
      C.zoom = 1 + e * 16; C.res = Math.max(.07, 1 - easeOut(k) * .95);
      $('black').style.opacity = clamp((k - .7) / .3, 0, 1);
    }
    if (I.k > 2.2 && !C.done) { C.done = true; enterHall(true); }
  }
  if (C.led > 0) C.led = Math.max(0, C.led - dt * .6);
}

function startInsert() {
  if (C.insert || C.done) return;
  C.back = null;
  C.insert = { k: 0, x: C.x, y: C.y, s: C.s, a0: 0 };
  document.querySelector('.cui .call').style.opacity = 0;
}
coinCv.addEventListener('pointerdown', e => {
  if (C.insert || C.done) return;
  const L = coinLayout();
  if (Math.hypot(e.clientX - C.x, e.clientY - C.y) > L.R * C.s * 1.05) return;
  C.back = null; C.drag = { ox: e.clientX - C.x, oy: e.clientY - C.y, sx: e.clientX, sy: e.clientY, moved: false };
  coinCv.setPointerCapture(e.pointerId);
});
coinCv.addEventListener('pointermove', e => {
  const L = coinLayout();
  coinCv.style.cursor = C.drag ? 'grabbing' : Math.hypot(e.clientX - C.x, e.clientY - C.y) < L.R * C.s ? 'grab' : 'default';
  if (!C.drag) return;
  if (Math.hypot(e.clientX - C.drag.sx, e.clientY - C.drag.sy) > 8) C.drag.moved = true;
  C.x = e.clientX - C.drag.ox * C.s; C.y = e.clientY - C.drag.oy * C.s;
  const d = clamp((C.y - L.cy) / (L.slot.y - L.cy), 0, 1); C.s = lerp(1, .45, d);   // 越靠近投币口越小
});
coinCv.addEventListener('pointerup', e => {
  if (!C.drag) return;
  const L = coinLayout(), P = L.panel, d = C.drag; C.drag = null;
  const nearSlot = C.x > P.x - 40 && C.x < P.x + P.w + 40 && C.y > P.y - L.R * .9 && C.y < P.y + P.h + 30;
  if (!d.moved || nearSlot) startInsert(); else C.back = { k: 0, x: C.x, y: C.y, s: C.s };
});
addEventListener('keydown', e => { if (!inHall && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); startInsert(); } });

/* =====================================================================
   场景二：像素街机厅
   ===================================================================== */
const hallCv = $('hall'), hg = hallCv.getContext('2d');
let PX = 4, VW = 360, VH = 225, FY = 190;            // 像素尺寸、视口（逻辑像素）、地面线
const CAB_W = 52, CAB_H = 96, GAP = 22;
const games = A.games.filter(g => g.zone === ZONE);
const cabs = games.map(g => ({ g }));

// 像素文字：按 K 倍精度画到离屏画布再做阈值 → 硬边像素字。

const TEXT_K = 2;
const textCache = new Map();
function ptext(str, size, color, weight = 900, family = '"WenQuanYi Zen Hei Sharp","PingFang SC","Microsoft YaHei",sans-serif') {

  g.putImageData(d, 0, 0);

  textCache.set(key, t); return t;
}
const pdraw = (g, t, x, y) => g.drawImage(t.img, x, y, t.img.width / TEXT_K, t.img.height / TEXT_K);

const INV = [['00100000100', '00010001000', '00111111100', '01101110110', '11111111111', '10111111101', '10100000101', '00011011000'],

const noise = document.createElement('canvas'); noise.width = 36; noise.height = 28; const ng = noise.getContext('2d');
const thumb = document.createElement('canvas'); thumb.width = thumb.height = 22; const tg = thumb.getContext('2d');

function hallSize() {
  const W = innerWidth, Hh = innerHeight;
  // 选能放下「导航 + 招牌 + 小怪带 + 机器 + 底部信息板」的最大像素倍数
  const panelH = ($('panel').offsetHeight || 120) + 30;               // 信息板实际高度（屏幕像素）
  const bot = px => Math.max(Math.ceil(panelH / px), W < 640 ? 0 : 42);
  const need = px => Math.round((W < 640 ? 112 : 60) / px) + 74 + CAB_H + bot(px);
  PX = 2; for (let px = 6; px > 2; px--) if (Hh / px >= need(px) && W / px >= 120) { PX = px; break; }
  const bottom = bot(PX);

  const row = cabs.length * (CAB_W + GAP) - GAP;

}
const cabX = i => x0 + i * (CAB_W + GAP);
const camTarget = () => clamp(cabX(sel) + CAB_W / 2 - VW / 2, 0, SW - VW);

function drawHall(t) {

  g.fillStyle = '#2a1f45'; g.fillRect(sx - 10, sy - 5, sign.width + 20, 1); g.fillRect(sx - 10, sy + sign.height + sub.height + 7, sign.width + 20, 1);

  g.fillStyle = 'rgba(94,242,255,.18)'; g.fillRect(0, band - 3, SW, 1); g.fillRect(0, band + 11, SW, 1);

    g.fillStyle = i === sel ? 'rgba(255,233,176,.07)' : 'rgba(255,233,176,.035)';

  // 地板：棋盘格

    for (let x = -20 + (r % 2) * 10; x < SW + 20; x += 20) { g.fillStyle = r % 2 ? '#150d24' : '#1d1233'; g.fillRect(x, y, 10, 5); g.fillStyle = r % 2 ? '#1d1233' : '#150d24'; g.fillRect(x + 10, y, 10, 5); }

  g.fillStyle = 'rgba(255,240,200,.35)';

}

function drawCab(g, c, i, t) {

  g.fillStyle = '#0e0a17'; g.fillRect(x, top, CAB_W, CAB_H);

  g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(scx, scy, sw, 1); g.fillRect(scx, scy, 1, sh);

function drawScreen(g, c, x, y, w, h, t, i) {

    g.fillStyle = '#0b3d2a'; g.fillRect(x, y, w, h);
    g.fillStyle = '#0f5238'; for (let k = 0; k < h; k += 4) g.fillRect(x, y + k, w, 1);

/* ---------- 信息板 ---------- */
function updatePanel() {
  const c = cabs[sel], g = c.g;
  $('pImg').src = g ? root(g.art[4] || g.art[0]) : 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8"><rect width="8" height="8" fill="#222"/><text x="4" y="6.2" font-size="6" text-anchor="middle" fill="#888" font-family="monospace">?</text></svg>');
  $('pName').innerHTML = g ? `${esc(g.name)}<small>${esc(g.en)}</small>` : `维修中<small>COMING SOON</small>`;
  $('pDesc').textContent = g ? g.blurb : '这台机器还在调试，新游戏很快上架。';
  $('pSt').textContent = g ? `● ${g.status} · ${g.players}` : '○ OUT OF ORDER';
  $('pSt').className = 'st' + (g && g.live ? '' : ' off');
  $('pGo').disabled = !(g && g.live);
  $('pGo').textContent = g && g.live ? '▶ START' : '维修中';
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function select(i, sound = true) {
  i = clamp(i, 0, cabs.length - 1); if (i === sel) return;
  sel = i; camT = camTarget(); updatePanel(); if (sound) sndMove();
}
function launch() {
  const c = cabs[sel]; if (!c.g || !c.g.live || H.launch) return;
  sndStart(); history.replaceState(null, '', '#hall');
  H.launch = { k: 0, url: c.g.url };
  $('panel').classList.remove('on');
}

function enterHall(fromCoin) {
  inHall = true; document.body.classList.add('hallmode');
  $('skip').style.display = 'none';
  updatePanel(); hallSize();
  hallCv.style.opacity = 1; coinCv.style.display = 'none';
  $('black').style.transition = 'opacity .5s'; $('black').style.opacity = 0;
  $('credit').textContent = fromCoin ? '01' : '00';
  if (fromCoin && !reduce) { H.intro = { k: 0 }; H.boot = 1; sndBoot(); }
  else { $('panel').classList.add('on'); }
  if (location.hash !== '#hall') history.replaceState(null, '', '#hall');
}
function leaveHall() {        // 退币：回到投币场景
  location.hash = ''; location.reload();
}

function hallUpdate(dt, t) {
  camX += (camT - camX) * Math.min(1, dt * 7);
  if (H.swipe && H.swipe.active) camX = H.swipe.cam;
  if (H.intro) {               // 镜头从选中机器的屏幕里拉出来
    H.intro.k += dt / 1.9; const k = ease(clamp(H.intro.k, 0, 1));
    const fx = cabX(sel) + 8 + 18, fy = FY - CAB_H + 19 + 14;
    H.zoom = lerp(11, 1, k); H.fx = lerp(fx, camX + VW / 2, k); H.fy = lerp(fy, VH / 2, k);
    H.boot = Math.max(0, 1 - H.intro.k * 2.2);
    if (H.intro.k >= 1) { H.intro = null; H.zoom = 1; $('panel').classList.add('on'); }
  }
  if (H.launch) {              // 镜头钻进屏幕 → 跳转游戏
    H.launch.k += dt / .9; const k = ease(clamp(H.launch.k, 0, 1));
    const fx = cabX(sel) + 26, fy = FY - CAB_H + 33;
    H.zoom = lerp(1, 12, k); H.fx = lerp(camX + VW / 2, fx, k); H.fy = lerp(VH / 2, fy, k);
    $('white').style.opacity = clamp((H.launch.k - .6) / .4, 0, 1);
    if (H.launch.k >= 1 && !H.launch.gone) { H.launch.gone = true; location.href = H.launch.url; }
  }
}

// 输入：鼠标悬停选机器、点击开始；触摸左右滑动换机器
function hitCab(e) {
  const lx = e.clientX / PX + camX, ly = e.clientY / PX;
  for (let i = 0; i < cabs.length; i++) { const x = cabX(i); if (lx >= x - 4 && lx <= x + CAB_W + 4 && ly >= FY - CAB_H - 14 && ly <= FY + 6) return i; }
  return -1;
}
hallCv.addEventListener('pointermove', e => {
  if (!inHall || H.intro || H.launch) return;
  if (H.swipe) {
    const dx = e.clientX - H.swipe.x;
    if (Math.abs(dx) > 8) H.swipe.active = true;
    if (H.swipe.active) H.swipe.cam = clamp(H.swipe.cam0 - dx / PX, 0, SW - VW);
    return;
  }
  if (e.pointerType === 'mouse') { const i = hitCab(e); hallCv.style.cursor = i >= 0 ? 'pointer' : 'default'; if (i >= 0) select(i); }
});
hallCv.addEventListener('pointerdown', e => {
  if (!inHall || H.intro || H.launch) return;
  H.swipe = { x: e.clientX, cam0: camX, cam: camX, active: false, hit: hitCab(e) };
  hallCv.setPointerCapture(e.pointerId);
});
hallCv.addEventListener('pointerup', e => {
  const s = H.swipe; H.swipe = null; if (!s) return;
  if (s.active) {             // 松手后吸附到离中心最近的机器
    let best = 0, bd = 1e9; cabs.forEach((c, i) => { const d = Math.abs(cabX(i) + CAB_W / 2 - (camX + VW / 2)); if (d < bd) { bd = d; best = i; } });
    sel = -1; select(best);
  } else if (s.hit >= 0) { if (s.hit === sel) launch(); else select(s.hit); }
});
addEventListener('keydown', e => {
  if (!inHall || H.intro || H.launch) return;
  if (e.key === 'ArrowLeft' || e.key === 'a') select(sel - 1);
  else if (e.key === 'ArrowRight' || e.key === 'd') select(sel + 1);
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); launch(); }
  else if (e.key === 'Escape') leaveHall();
});
$('pGo').addEventListener('click', launch);
$('skip').addEventListener('click', e => { e.preventDefault(); C.done = true; enterHall(false); });
addEventListener('resize', () => { coinSize(); if (inHall) hallSize(); });
if (window.ResizeObserver) new ResizeObserver(() => { if (inHall) hallSize(); }).observe($('panel'));   // 信息板高度变了（字体加载、换机器）就重新排版
addEventListener('pageshow', e => { if (e.persisted && H.launch) { H.launch = null; H.zoom = 1; $('white').style.opacity = 0; $('panel').classList.add('on'); } });

/* ---------- 分区导航 ---------- */
(() => {
  const nav = $('zones');
  nav.innerHTML = A.zones.map(z => `<button data-z="${esc(z.id)}" class="${z.id === ZONE ? 'on' : ''}">${esc(z.name)}${z.open ? '' : '<small>SOON</small>'}</button>`).join('');
  let tm;
  nav.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const z = A.zones.find(z => z.id === b.dataset.z);
    if (z.id === ZONE) return;
    if (z.open && z.href) { location.href = root(z.href); return; }
    const t = $('toast'); t.textContent = `${z.name} 筹备中，敬请期待`; t.classList.add('on');
    clearTimeout(tm); tm = setTimeout(() => t.classList.remove('on'), 1800); sndMove();
  });
})();

/* ---------- 主循环 ---------- */
coinSize();
if (location.hash === '#hall') { C.done = true; enterHall(false); }
let last = performance.now(); const T0 = last;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)), t = Math.max(0, now - T0) / 1000; last = now;
  if (!inHall) { coinUpdate(dt, t); drawCoinScene(t); }
  else { hallUpdate(dt, t); drawHall(t); }
}
requestAnimationFrame(loop);
</script>
